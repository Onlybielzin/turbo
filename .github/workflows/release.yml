name: Release

# Builda o app Tauri (Linux + Windows) e publica um GitHub Release com os
# instaladores (.AppImage + .deb no Linux, .exe/NSIS no Windows) sempre que uma
# tag "v*" for enviada.
# Dispare com: git tag v0.1.0 && git push origin v0.1.0
# (ou use a skill /publish do projeto, que automatiza o bump + tag).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend deps
        run: npm ci
        working-directory: app

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Turbo ${{ github.ref_name }}"
          releaseBody: "Instaladores gerados pelo CI. Linux: .AppImage e .deb. Windows: .exe (instalador NSIS). Baixe abaixo."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: "--bundles appimage,deb"

  # Windows: roda depois do Linux (needs) para o Release já existir e este job só
  # ANEXAR o instalador .exe — evita corrida de dois jobs criando o mesmo release.
  release-windows:
    runs-on: windows-latest
    needs: release-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend deps
        run: npm ci
        working-directory: app

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Turbo ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # NSIS produz um instalador .exe (Turbo_<versão>_x64-setup.exe).
          args: "--bundles nsis"

  # Avisa no Discord SÓ depois do build no CI (Linux + Windows) ter dado certo.
  # O resumo para leigos é escrito pela skill /publish em .github/RELEASE_MESSAGE.md
  # e commitado junto do release; aqui só lemos o arquivo e postamos no webhook.
  notify-discord:
    runs-on: ubuntu-22.04
    needs: [release-linux, release-windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Postar resumo do release no Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Secret DISCORD_WEBHOOK ausente — pulando aviso."
            exit 0
          fi
          if [ ! -f .github/RELEASE_MESSAGE.md ]; then
            echo ".github/RELEASE_MESSAGE.md ausente — pulando aviso."
            exit 0
          fi
          MSG="$(cat .github/RELEASE_MESSAGE.md)"
          curl -sS -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$MSG" '{content: $c}')" \
            "$DISCORD_WEBHOOK"
